[project]
name = "dailybrief"
version = "0.1.1"
description = "Daily Brief: local-first Python AI news and markets digest generator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "anthropic>=0.39.0",
  "beautifulsoup4>=4.12.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "json-repair>=0.30.0",
  "openai>=1.55.0",
  "python-dotenv>=1.0.1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
dailybrief = "dailybrief.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dailybrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
